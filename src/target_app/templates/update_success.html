<!DOCTYPE html>
<html>
<head>
    <title>MemberLink Pro - Update Successful</title>
    <style>
        body { font-family: Arial, sans-serif; background: #e8e8e8; margin: 0; padding: 0; }
        .header { background: #1a3a6b; color: white; padding: 10px 20px; }
        .header h1 { margin: 0; font-size: 18px; }
        .header span { font-size: 12px; color: #aac4ff; }
        .container { margin: 30px auto; max-width: 700px; }
        .panel { background: white; border: 1px solid #999; padding: 0; }
        .panel-title { background: #c8d8f0; border-bottom: 1px solid #999; padding: 6px 12px; font-weight: bold; font-size: 13px; color: #1a3a6b; }
        .success { color: green; padding: 16px; font-size: 14px; }
        .actions { padding: 10px 12px; }
        .btn { background: #1a3a6b; color: white; border: none; padding: 5px 18px; cursor: pointer; font-size: 13px; text-decoration: none; display: inline-block; }
    </style>
</head>
<body>
    <div class="header">
        <h1>MemberLink Pro</h1>
        <span>Staff Internal Portal &mdash; Authorized Use Only</span>
    </div>
    <div class="container">
        <div class="panel">
            <div class="panel-title">Update Result</div>
            <div class="success" id="update-success-message">
                &#10003; Account for <strong>{{ member.name }}</strong> (ID: {{ member_id }}) has been successfully updated.<br>
                The change has been recorded in the audit log.
            </div>
            <div class="actions">
                <a href="/member/{{ member_id }}" class="btn">View Account</a>
                &nbsp;
                <a href="/search" class="btn">Back to Search</a>
            </div>
        </div>
    </div>
</body>
</html>
