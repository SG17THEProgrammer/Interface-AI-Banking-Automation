<!DOCTYPE html>
<html>
<head>
    <title>MemberLink Pro - Staff Portal</title>
    <style>
        body { font-family: Arial, sans-serif; background: #e8e8e8; margin: 0; padding: 0; }
        .header { background: #1a3a6b; color: white; padding: 10px 20px; }
        .header h1 { margin: 0; font-size: 18px; }
        .header span { font-size: 12px; color: #aac4ff; }
        .container { margin: 30px auto; max-width: 700px; }
        .panel { background: white; border: 1px solid #999; padding: 0; }
        .panel-title { background: #c8d8f0; border-bottom: 1px solid #999; padding: 6px 12px; font-weight: bold; font-size: 13px; color: #1a3a6b; }
        table { width: 100%; border-collapse: collapse; }
        td { padding: 8px 12px; font-size: 13px; vertical-align: middle; }
        td.label { width: 180px; color: #333; font-weight: bold; }
        .btn { background: #1a3a6b; color: white; border: none; padding: 5px 18px; cursor: pointer; font-size: 13px; }
        .btn:hover { background: #2a5aab; }
        .error { color: red; font-size: 12px; padding: 4px 12px; }
        .footer { margin-top: 8px; font-size: 11px; color: #666; text-align: right; padding: 4px 8px; border-top: 1px solid #ccc; }
    </style>
</head>
<body>
    <div class="header">
        <h1>MemberLink Pro</h1>
        <span>Staff Internal Portal &mdash; Authorized Use Only</span>
    </div>
    <div class="container">
        <div class="panel">
            <div class="panel-title">Member Search</div>
            {% if error %}
            <div class="error">{{ error }}</div>
            {% endif %}
            <form method="POST" action="/search">
                <table>
                    <tr>
                        <td class="label">Member ID Number:</td>
                        <td>
                            <input type="text" name="member_id" placeholder="Enter 6-digit Member ID"
                                   style="width:200px;padding:3px;font-size:13px;" aria-label="Member ID" />
                        </td>
                    </tr>
                    <tr>
                        <td class="label">Search Type:</td>
                        <td>
                            <select name="search_type" style="font-size:13px;">
                                <option value="id">By Member ID</option>
                                <option value="name">By Name</option>
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <td></td>
                        <td>
                            <input type="submit" value="Search" class="btn" aria-label="Search" />
                            &nbsp;
                            <input type="reset" value="Clear" class="btn" style="background:#666;" />
                        </td>
                    </tr>
                </table>
            </form>
            <div class="footer">MemberLink Pro v4.2.1 &copy; 2019 CoreSys Inc.</div>
        </div>
    </div>
</body>
</html>
