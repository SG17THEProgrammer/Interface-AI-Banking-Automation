<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MemberLink Assistant</title>
<style>
  :root {
    --bg:#0d1117; --surface:#161b22; --surface2:#1c2128; --surface3:#21262d;
    --border:rgba(255,255,255,.08); --border2:rgba(255,255,255,.15);
    --text:#e6edf3; --muted:#7d8590; --accent:#6366f1; --accent2:#818cf8;
    --success:#3fb950; --warn:#d29922; --danger:#f85149; --info:#58a6ff;
    --user-bubble:#1f2d4a; --bot-bubble:#1c2128;
    --mono:'JetBrains Mono','Fira Code',monospace;
    --sans:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);
       font-size:14px;height:100vh;display:flex;flex-direction:column;overflow:hidden}

  /* ── Header ── */
  .header{background:var(--surface);border-bottom:1px solid var(--border);
          padding:12px 20px;display:flex;align-items:center;gap:12px;flex-shrink:0}
  .logo{width:32px;height:32px;background:var(--accent);border-radius:8px;
        display:flex;align-items:center;justify-content:center;
        font-size:16px;font-weight:800;color:#fff;flex-shrink:0}
  .header-text h1{font-size:14px;font-weight:600}
  .header-text p{font-size:11px;color:var(--muted);margin-top:1px}
  .status-dot{width:8px;height:8px;border-radius:50%;background:#555;
              margin-left:auto;transition:background .3s}
  .status-dot.online{background:var(--success)}
  .status-dot.offline{background:var(--danger)}
  .status-label{font-size:11px;color:var(--muted);margin-left:4px}

  /* ── Messages ── */
  .messages{flex:1;overflow-y:auto;padding:20px;display:flex;
            flex-direction:column;gap:16px}
  .messages::-webkit-scrollbar{width:4px}
  .messages::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

  .bubble-wrap{display:flex;gap:10px;max-width:820px;width:100%}
  .bubble-wrap.user{align-self:flex-end;flex-direction:row-reverse}
  .bubble-wrap.bot {align-self:flex-start}

  .avatar{width:30px;height:30px;border-radius:50%;flex-shrink:0;
          display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
  .avatar.user{background:var(--accent);color:#fff}
  .avatar.bot {background:var(--surface3);color:var(--accent2);border:1px solid var(--border2)}

  .bubble{background:var(--bot-bubble);border:1px solid var(--border);
          border-radius:12px;padding:12px 14px;max-width:680px;line-height:1.6}
  .bubble-wrap.user .bubble{background:var(--user-bubble);border-color:rgba(99,102,241,.3)}

  /* markdown-ish: bold */
  .bubble b, .bubble strong{font-weight:600;color:var(--text)}

  /* meta line below bot bubble */
  .meta{display:flex;align-items:center;gap:8px;margin-top:6px;padding-left:2px}
  .meta-text{font-size:11px;color:var(--muted)}
  .details-btn{display:inline-flex;align-items:center;gap:4px;
               background:var(--surface2);border:1px solid var(--border2);
               color:var(--accent2);padding:2px 9px;border-radius:4px;
               font-size:11px;font-family:var(--sans);cursor:pointer;
               text-decoration:none;transition:all .15s}
  .details-btn:hover{border-color:var(--accent);background:var(--surface3)}
  .outcome-tag{padding:1px 7px;border-radius:3px;font-size:10px;font-weight:500}
  .outcome-tag.success{background:rgba(63,185,80,.12);color:var(--success)}
  .outcome-tag.business_outcome{background:rgba(210,153,34,.12);color:var(--warn)}
  .outcome-tag.hard_failure{background:rgba(248,81,73,.12);color:var(--danger)}

  /* thinking indicator */
  .thinking{display:flex;gap:4px;align-items:center;padding:10px 0}
  .thinking span{width:6px;height:6px;border-radius:50%;background:var(--muted);
                 animation:blink 1.2s infinite}
  .thinking span:nth-child(2){animation-delay:.2s}
  .thinking span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}

  /* ── Input area ── */
  .input-area{background:var(--surface);border-top:1px solid var(--border);
              padding:14px 20px;flex-shrink:0}
  .input-row{display:flex;gap:10px;max-width:820px;margin:0 auto}
  .input-box{flex:1;background:var(--surface2);border:1px solid var(--border2);
             border-radius:10px;padding:10px 14px;color:var(--text);
             font-size:14px;font-family:var(--sans);resize:none;
             min-height:44px;max-height:120px;line-height:1.5;outline:none;
             transition:border-color .15s}
  .input-box:focus{border-color:var(--accent)}
  .input-box::placeholder{color:var(--muted)}
  .send-btn{width:44px;height:44px;background:var(--accent);border:none;
            border-radius:10px;cursor:pointer;display:flex;align-items:center;
            justify-content:center;flex-shrink:0;transition:background .15s}
  .send-btn:hover{background:var(--accent2)}
  .send-btn:disabled{background:var(--surface3);cursor:not-allowed}
  .send-btn svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2}

  .suggestions{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
  .sug-btn{background:var(--surface2);border:1px solid var(--border2);color:var(--accent2);
           padding:4px 12px;border-radius:20px;font-size:11px;font-family:var(--sans);
           cursor:pointer;transition:all .15s}
  .sug-btn:hover{border-color:var(--accent);background:var(--surface3);color:var(--text)}
</style>
</head>
<body>

<!-- Header -->
<header class="header">
  <div class="logo">M</div>
  <div class="header-text">
    <h1>MemberLink Assistant</h1>
    <p>Banking automation · Powered by the replay engine</p>
  </div>
  <div class="status-dot" id="status-dot"></div>
  <span class="status-label" id="status-label">checking…</span>
</header>

<!-- Messages -->
<div class="messages" id="messages">
  <!-- Welcome message -->
  <div class="bubble-wrap bot">
    <div class="avatar bot">M</div>
    <div>
      <div class="bubble">
        👋 Hi! I can look up member balances and update account statuses. Try one of these:
      </div>
      <div class="suggestions">
        <button class="sug-btn" onclick="suggest(this)">What is Alice's balance?</button>
        <button class="sug-btn" onclick="suggest(this)">Check Bob's account</button>
        <button class="sug-btn" onclick="suggest(this)">Is Carol's account active?</button>
        <button class="sug-btn" onclick="suggest(this)">Freeze Carol's account</button>
        <button class="sug-btn" onclick="suggest(this)">Reactivate Carol's account</button>
        <button class="sug-btn" onclick="suggest(this)">Check member 100004</button>
      </div>
    </div>
  </div>
</div>

<!-- Input -->
<div class="input-area">
  <div class="input-row">
    <textarea class="input-box" id="input" placeholder="Ask about a member… e.g. 'balance for 100002'"
              rows="1" autocomplete="off"></textarea>
    <button class="send-btn" id="send-btn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>

</div>

<script>
const messagesEl = document.getElementById('messages');
const inputEl    = document.getElementById('input');
const sendBtn    = document.getElementById('send-btn');

// ── Status — check on load, retry once, recheck before each send ─────────
async function checkStatus() {
  try {
    const r = await fetch('/api/health-proxy', { signal: AbortSignal.timeout(3000) });
    const d = await r.json();
    setStatus(d.online === true);
  } catch {
    setStatus(false);
  }
}
function setStatus(online) {
  document.getElementById('status-dot').className = 'status-dot ' + (online ? 'online' : 'offline');
  document.getElementById('status-label').textContent = online ? 'Banking app online' : 'Banking app offline';
}
// Check immediately, then once more after 3s in case the banking app is still starting
checkStatus();
setTimeout(checkStatus, 3000);

// ── Auto-resize textarea ──────────────────────────────────────────────────
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
});
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

// ── Render helpers ────────────────────────────────────────────────────────
function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function renderMarkdown(s) {
  // Very minimal: **bold**, newlines → <br>
  return escHtml(s)
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');
}

function appendUserBubble(text) {
  const wrap = document.createElement('div');
  wrap.className = 'bubble-wrap user';
  wrap.innerHTML = `
    <div class="avatar user">U</div>
    <div class="bubble">${renderMarkdown(text)}</div>`;
  messagesEl.appendChild(wrap);
  scrollBottom();
}

function appendThinking() {
  const wrap = document.createElement('div');
  wrap.className = 'bubble-wrap bot';
  wrap.id = 'thinking';
  wrap.innerHTML = `
    <div class="avatar bot">M</div>
    <div class="bubble">
      <div class="thinking"><span></span><span></span><span></span></div>
    </div>`;
  messagesEl.appendChild(wrap);
  scrollBottom();
}

function removeThinking() {
  const el = document.getElementById('thinking');
  if (el) el.remove();
}

function appendBotBubble(reply, jobId, result) {
  const wrap = document.createElement('div');
  wrap.className = 'bubble-wrap bot';

  // Outcome tag
  const otype = result?.outcome_type || '';
  const tagLabel = { success:'✅ success', business_outcome:'⚑ business outcome',
                     hard_failure:'❌ hard failure' }[otype] || otype;

  // Meta line
  const dur = result ? result.duration_seconds.toFixed(1) + 's' : '';
  const steps = result ? result.steps_completed + ' steps' : '';
  const metaText = [dur, steps].filter(Boolean).join(' · ');

  const detailsBtn = jobId
    ? `<a class="details-btn" href="/dashboard?job=${encodeURIComponent(jobId)}" target="_blank">
         🔍 View run details
       </a>`
    : '';

  const outcomeTag = otype
    ? `<span class="outcome-tag ${otype}">${tagLabel}</span>`
    : '';

  wrap.innerHTML = `
    <div class="avatar bot">M</div>
    <div>
      <div class="bubble">${renderMarkdown(reply)}</div>
      ${(metaText || detailsBtn) ? `
      <div class="meta">
        ${metaText ? `<span class="meta-text">${escHtml(metaText)}</span>` : ''}
        ${outcomeTag}
        ${detailsBtn}
      </div>` : ''}
    </div>`;
  messagesEl.appendChild(wrap);
  scrollBottom();
}

function scrollBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

// ── Suggestion buttons ───────────────────────────────────────────────────
function suggest(btn) {
  inputEl.value = btn.textContent.trim();
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  inputEl.focus();
}

// ── Send ──────────────────────────────────────────────────────────────────
async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;

  inputEl.value = '';
  inputEl.style.height = 'auto';
  sendBtn.disabled = true;

  appendUserBubble(text);
  appendThinking();
  checkStatus(); // refresh dot on actual use

  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text }),
    });
    const data = await resp.json();
    removeThinking();
    appendBotBubble(data.reply || '(no reply)', data.job_id, data.result);
  } catch (err) {
    removeThinking();
    appendBotBubble('⚠️ Request failed: ' + err.message, null, null);
  } finally {
    sendBtn.disabled = false;
    inputEl.focus();
  }
}
</script>
</body>
</html>
